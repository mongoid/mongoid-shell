name: Test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '2.7', mongoid: '3', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '4', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '5', mongodb: '4.4' }
          - { ruby: '3.3', mongoid: '6', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '7', mongodb: '5.0' }
          - { ruby: '3.2', mongoid: '8', mongodb: '6.0' }
          - { ruby: '3.3', mongoid: '9', mongodb: '7.0' }
          - { ruby: '3.4', mongoid: '9', mongodb: '8.0' }
          - { ruby: '4.0', mongoid: '9', mongodb: '8.0' }

    name: test (ruby=${{ matrix.entry.ruby }}, mongoid=${{ matrix.entry.mongoid }}, mongodb=${{ matrix.entry.mongodb }})

    env:
      BUNDLE_BUILD__BSON: --with-cflags=-Wno-error=implicit-function-declaration
      COVERAGE: 'true'
      MONGOID_VERSION: ${{ matrix.entry.mongoid }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.entry.mongodb }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '${{ matrix.entry.ruby }}'
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/.resultset.json
          format: simplecov
          parallel: true
          flag-name: ruby-${{ matrix.entry.ruby }}-mongoid-${{ matrix.entry.mongoid }}

  coverage:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Finish parallel coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
